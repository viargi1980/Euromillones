name: Reentrenar Euromillones

on:
  schedule:
    - cron: '0 3 * * 6'
    - cron: '0 3 * * 3'
    - cron: '0 5 * * 6'
    - cron: '0 5 * * 3'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar sorteos
        run: python main.py

      - name: Reentrenar modelos
        run: python AutoTrain.py

      - name: Generar web
        run: python docs/generar_web.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/
          git add prediccion.json

          git diff --staged --quiet || git commit -m "Actualizar web Euromillones"
          git push